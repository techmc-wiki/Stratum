name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vet-test-build:
    name: Vet, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum tools/lucy/go.mod tools/lucy/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build Linux amd64 binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/linux-amd64
          go build -trimpath -o dist/linux-amd64/stratum ./cmd/stratum
          go build -trimpath -o dist/linux-amd64/stratum-agent ./cmd/stratum-agent
          go build -trimpath -o dist/linux-amd64/stratum-controller ./cmd/stratum-controller
          go build -trimpath -o dist/linux-amd64/lucy ./cmd/lucy

      - name: Upload Linux amd64 binaries
        uses: actions/upload-artifact@v7
        with:
          name: stratum-linux-amd64
          path: dist/linux-amd64/
          if-no-files-found: error
