services:
  agent-java8:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        JAVA_VERSION: 8
    ports:
      - "8787:8787"
    volumes:
      - agent8-runtime:/runtime
    environment:
      - STRATUM_CONTROLLER_URL=http://host.docker.internal:8080
      - STRATUM_AGENT_TOKEN=${AGENT_TOKEN:-}
      - STRATUM_HTTP_PROXY=${HTTP_PROXY:-}
      - STRATUM_LUCY_WORKSPACE=${LUCY_WORKSPACE:-none}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-java17:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        JAVA_VERSION: 17
    ports:
      - "8788:8787"
    volumes:
      - agent17-runtime:/runtime
    environment:
      - STRATUM_CONTROLLER_URL=http://host.docker.internal:8080
      - STRATUM_AGENT_TOKEN=${AGENT_TOKEN:-}
      - STRATUM_HTTP_PROXY=${HTTP_PROXY:-}
      - STRATUM_LUCY_WORKSPACE=${LUCY_WORKSPACE:-none}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-java21:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        JAVA_VERSION: 21
    ports:
      - "8789:8787"
    volumes:
      - agent21-runtime:/runtime
    environment:
      - STRATUM_CONTROLLER_URL=http://host.docker.internal:8080
      - STRATUM_AGENT_TOKEN=${AGENT_TOKEN:-}
      - STRATUM_HTTP_PROXY=${HTTP_PROXY:-}
      - STRATUM_LUCY_WORKSPACE=${LUCY_WORKSPACE:-none}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  agent8-runtime:
  agent17-runtime:
  agent21-runtime:
